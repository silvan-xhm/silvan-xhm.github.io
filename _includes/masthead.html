<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-name" href="{{ '/' | relative_url }}">Homepage</a>
    <button class="menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="Open navigation" title="Open navigation"><i class="fas fa-bars" aria-hidden="true"></i></button>
    <nav id="site-navigation" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}<a href="{{ link.url }}">{{ link.title }}</a>{% endfor %}
    </nav>
  </div>
</header>
